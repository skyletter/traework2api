<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>traework2api 控制台</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --card2:#1d212b; --fg:#e6e9ef; --dim:#8a93a6;
          --ok:#3fb96b; --warn:#e0a33e; --bad:#e05d5d; --accent:#4d9fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .toolbar { display:flex; gap:10px; align-items:center; }
  .btn { background:var(--card2); color:var(--fg); border:1px solid #2a2f3a; border-radius:8px;
         padding:8px 16px; font-size:13px; cursor:pointer; transition:.15s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  #ts { color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid #232836; border-radius:12px; padding:18px 18px 14px; }
  .card.err { border-color:var(--bad); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .nick { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uid { color:var(--dim); font-size:11px; margin-top:2px; font-family:Consolas,monospace; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .badge { font-size:11px; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .b-ok   { background:#173a26; color:var(--ok); }
  .b-warn { background:#3a2d13; color:var(--warn); }
  .b-bad  { background:#3a1717; color:var(--bad); }
  .b-dim  { background:#22262f; color:var(--dim); }
  .credits { margin:16px 0 14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .remain { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .remain span { font-size:14px; color:var(--dim); font-weight:400; margin-left:4px; }
  .meta { color:var(--dim); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .meta b { color:var(--fg); font-weight:600; }
  .errline { margin-top:10px; color:var(--bad); font-size:12px; word-break:break-all; }
  .todo { margin-top:26px; border:1px dashed #2c3240; border-radius:12px; padding:16px 18px; color:var(--dim); font-size:13px; }
  .todo h2 { font-size:14px; color:var(--fg); font-weight:600; margin-bottom:8px; }
  .todo ul { padding-left:18px; line-height:1.9; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--card2); border-top-color:var(--accent);
          border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>traework2api 控制台<small>额度监控 · 本地面板</small></h1>
    <div class="toolbar">
      <span id="ts"></span>
      <button class="btn" onclick="load()">刷新</button>
    </div>
  </header>
  <div class="grid" id="grid"><div style="color:var(--dim)"><span class="spin"></span> 加载中...</div></div>
  <div class="todo">
    <h2>待开发（CLI 功能暂未映射到面板）</h2>
    <ul>
      <li>手动签到 / 批量签到</li>
      <li>Token 手动刷新</li>
      <li>账号池状态管理（冷却 / 禁用 / 启用）</li>
      <li>用量趋势统计</li>
    </ul>
  </div>
</div>
<script>
let timer = null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(text, cls){ return '<span class="badge '+cls+'">'+esc(text)+'</span>'; }
function fmt(n){ return (n==null?'-':Number(n).toLocaleString()); }

function render(d){
  const grid = document.getElementById('grid');
  if(!d.accounts || d.accounts.length===0){
    grid.innerHTML = '<div style="color:var(--dim)">暂无账号，请先运行 ./login.sh 添加凭证（auths/trae-*.json）</div>';
    document.getElementById('ts').textContent = d.fetched_at ? '更新于 '+d.fetched_at : '';
    return;
  }
  grid.innerHTML = d.accounts.map(a=>{
    let badges = '';
    if(a.error) badges += badge('查询失败','b-bad');
    else {
      if(a.checked_in) badges += badge('已签到','b-ok');
      else badges += a.checkin_enable ? badge('未签到','b-warn') : badge('签到禁用','b-dim');
      if(a.cooling) badges += badge('冷却中','b-warn');
      if(a.disabled) badges += badge('已禁用','b-bad');
      if(a.packs>0) badges += badge(a.packs+' 权益包','b-dim');
    }
    const remainLine = a.error ? '<div style="color:var(--bad);font-size:14px">额度查询失败</div>'
      : '<div class="remain">'+fmt(a.remain)+'<span>积分剩余</span></div>';
    const meta = a.error ? '' :
      '<div class="meta"><span>总量 <b>'+fmt(a.limit)+'</b></span><span>已用 <b>'+fmt(a.used)+'</b></span>'+
      (a.checkin_enable ? '<span>今日可领 <b>'+fmt(a.checkin_credits)+'</b></span>' : '')+'</div>';
    return '<div class="card'+(a.error?' err':'')+'">'
      + '<div class="card-top"><div><div class="nick">'+esc(a.nickname||'(未命名)')+'</div>'
      + '<div class="uid">'+esc(a.uid)+'</div></div><div class="badges">'+badges+'</div></div>'
      + remainLine + meta
      + (a.error ? '<div class="errline">'+esc(a.error)+'</div>' : '')
      + '</div>';
  }).join('');
  document.getElementById('ts').textContent = '更新于 '+d.fetched_at;
}

async function load(){
  const ts = document.getElementById('ts');
  ts.textContent = '刷新中...';
  try{
    const r = await fetch('/admin/api/credits', {cache:'no-store'});
    render(await r.json());
  }catch(e){
    document.getElementById('grid').innerHTML = '<div style="color:var(--bad)">加载失败：'+esc(e.message)+'（服务是否在运行？）</div>';
    ts.textContent = '';
  }
  if(timer) clearInterval(timer);
  timer = setInterval(load, 60000);
}
load();
</script>
</body>
</html>
