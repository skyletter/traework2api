name: Check Upstream / Community Updates

# 【重要变更 2026-09-26】
# 原上游 Sliverkiss/traework2api 已删库（仓库 404）。
# 本仓库现以 240xu/trae2api-more 为基线（纯原版代码，含 Web 管理面板、签到 self-healing）。
# 注：此前叠加的模型级冷却修复（tag: fix-v1）已暂缓，先观察原版效果，
#     如需恢复：git cherry-pick / git revert 对应提交即可。
# 240xu 不提供 Docker 镜像，镜像由本仓库 Actions 构建（GHCR + Release）。
#
# 其他同源社区分支（供参考）：
#   - connectedGraph/trae2api-web 240xu 的上游（Web 管理面板）
#   - JeffHu0912/trae2api        独立实现（多账号面板）
#
# 手动运行本 workflow 可检查社区分支的新提交（仅报告到 Summary，不自动合并）。

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: "要检查的仓库（owner/repo）"
        required: false
        default: "240xu/trae2api-more"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report diff vs upstream
        run: |
          REPO="${{ github.event.inputs.upstream }}"
          echo "检查目标: $REPO"
          git remote add upstream "https://github.com/${REPO}.git"
          if git fetch upstream main; then BRANCH=main; else git fetch upstream master && BRANCH=master; fi

          echo "## 与 $REPO 的差异报告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 对方独有提交（近 30 条）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git log --oneline HEAD..upstream/$BRANCH | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### 我们独有提交（含模型级冷却修复）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git log --oneline upstream/$BRANCH..HEAD | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
